spring.application.name=busondan

# CORS Settings
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://app.busondan.org,https://api.busondan.org}

# Server Port
server.port=5001

# Gyeonggi Bus API Key
ggbis.api.key=${GGBIS_API_KEY:YOUR_API_KEY}
subway.api.key=${SUBWAY_API_KEY:YOUR_API_KEY}

# Spring Datasource (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_DATABASE}?useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Hibernate) Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Settings
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

server.tomcat.accesslog.enabled=true
server.tomcat.basedir=.
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.pattern=%{X-Forwarded-For}i %l %u %t "%r" %s %b %Dms "%{User-Agent}i" "%{Referer}i"
